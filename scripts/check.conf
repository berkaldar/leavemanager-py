# scripts/check.conf — LeaveManager (Python 3.14 + Flask 3.1). Written at bootstrap 2026-11-21.
# One step per line: <name>: <command> — runs in order under sh, fails fast.
# Resource inventory (docs/testing.md, Resource hygiene): ruff and python -c start no daemon or
# server; importing app builds the Flask app object and seeds the in-memory Db, it never calls
# app.run — nothing is left running and no data outlives the process.
#
# Prerequisites: the project venv (.venv/Scripts/python — the bare `python` on this machine is the
# Microsoft Store stub; docs/conventions.md, Known traps).
requires lint: .venv/Scripts/python -m ruff --version
requires smoke: .venv/Scripts/python -c "import flask"

# --isolated: ignore any machine-level ruff config; --select: pin the rule set (syntax errors,
# undefined names, unused imports/variables) so a ruff upgrade cannot change it silently.
lint [fast]: .venv/Scripts/python -m ruff check --isolated --select E4,E7,E9,F .
# Import the app: catches syntax/import errors until tests exist.
smoke [fast]: .venv/Scripts/python -c "import app"

# Planned — activated by the first spec that adds tests (pytest exits 5 on "no tests collected").
# Split by marker, never by file list (docs/testing.md, Frameworks & layout):
# requires test: .venv/Scripts/python -m pytest --version
# test [fast]: .venv/Scripts/python -m pytest -q -p no:cacheprovider -m "not http"
# test-http: .venv/Scripts/python -m pytest -q -p no:cacheprovider -m http
